[package]
name = "tempo"
version = "2.2.2"
description = "Tempo - focus timer and usage insights"
authors = ["zekun"]
edition = "2021"

[lints.rust]
unexpected_cfgs = "allow"

[lib]
name = "tempo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Full MSVC debug symbols make this Tauri dependency graph several GiB per
# build mode. Keep line information for Tempo itself and omit symbols from
# dependencies; release builds are unaffected.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0

# Test binaries do not benefit enough from a second multi-GiB incremental
# cache to justify keeping it between runs.
[profile.test]
debug = "line-tables-only"
incremental = false

[profile.test.package."*"]
debug = 0

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent overlay windows (shelf) on macOS
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
jsonschema = { version = "0.49.1", default-features = false }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
active-win-pos-rs = "0.8"
parking_lot = "0.12"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
arboard = "3"
base64 = "0.22"
png = "0.17"
tauri-plugin-process = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tracing-appender = "0.2.5"
tracing-log = "0.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "process", "io-util", "fs"] }
tokio-util = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
rand = "0.8"
schemars = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = "0.45"
tiny-skia = "0.11"
usvg = "0.45"
urlencoding = "2"
unicode-normalization = "0.1"
netstat2 = "0.11.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(target_os = "macos")'.dependencies]
# NSPanel relies on AppKit and must only be resolved/compiled on macOS.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }
core-foundation = "0.10"
core-foundation-sys = "0.8"
appkit-nsworkspace-bindings = "0.1"
objc = "0.2"
block = "0.1"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSError", "NSBundle"] }
objc2-user-notifications = { version = "0.3", features = [
  "UNUserNotificationCenter",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSettings",
  "block2",
] }
window-vibrancy = "0.6"
# Feature-unify with tauri-plugin-notification's notify-rust so packaged .app
# builds use UNUserNotificationCenter (NSUserNotificationCenter is dead on modern macOS).
notify-rust = { version = "4.18", default-features = false, features = ["preview-macos-un"] }

[target.'cfg(windows)'.dependencies]
encoding_rs = "0.8"
raw-window-handle = "0.6"
window-vibrancy = "0.6"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
everything-ipc = "0.1.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
